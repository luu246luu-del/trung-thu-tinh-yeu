<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Thư gửi em — Trung thu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --red-lac:#c4152f; --red:#a3101f; --red-deep:#6f0716;
  --gold:#e9bb55; --gold-lt:#ffe9ae; --gold-dk:#a8792a;
  --cream:#fffaf0; --ink:#5a3a28; --ink-soft:#6f4c37;
  --rose:#ff5fa2; --plum:#5b1236; --moon:#ffe6a8;
  --f-body:"Quicksand",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-disp:"Playfair Display",Georgia,serif;
  --f-hand:"Dancing Script","Playfair Display",cursive;
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;}
html,body{height:100%;margin:0;background:#06030d;overflow:hidden;}
body{font-family:var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;}
#app{position:fixed;inset:0;overflow:hidden;}
img{max-width:100%;display:block;}
button{font-family:inherit;}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden;pointer-events:none;
  transition:opacity 820ms ease,visibility 820ms;}
.scene.active{opacity:1;visibility:visible;pointer-events:auto;}

/* ══════ hiệu ứng chạm toàn cục ══════ */
.fxlayer{position:fixed;inset:0;z-index:95;pointer-events:none;}
.ripple{position:absolute;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;
  border:2px solid rgba(255,220,150,.9);box-shadow:0 0 18px rgba(255,190,100,.7);
  animation:rip .75s cubic-bezier(.2,.8,.3,1) forwards;}
@keyframes rip{0%{transform:scale(.3);opacity:1;}100%{transform:scale(6);opacity:0;}}
.trail{position:absolute;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;
  background:radial-gradient(circle,#fff3cf,#f0b447 55%,rgba(200,130,30,0));
  animation:trailOut .85s ease-out forwards;}
@keyframes trailOut{0%{transform:scale(1);opacity:.9;}100%{transform:scale(.2) translateY(14px);opacity:0;}}

/* ══════ NÚT NHẠC ══════ */
.music-btn{position:fixed;z-index:96;top:calc(var(--st) + 14px);right:14px;
  width:46px;height:46px;border-radius:50%;cursor:pointer;display:none;place-items:center;
  border:1px solid rgba(233,187,85,.55);background:rgba(30,6,22,.5);backdrop-filter:blur(10px);
  color:var(--gold-lt);box-shadow:0 6px 20px rgba(0,0,0,.4);transition:transform .25s ease,background .25s ease;}
.music-btn.show{display:grid;}
.music-btn:hover{transform:scale(1.08);background:rgba(233,187,85,.22);}
.music-btn:active{transform:scale(.92);}
.eq{display:flex;align-items:flex-end;gap:2.5px;height:16px;}
.eq i{width:3px;background:currentColor;border-radius:2px;height:5px;animation:eqb .9s ease-in-out infinite;}
.eq i:nth-child(2){animation-delay:.15s;} .eq i:nth-child(3){animation-delay:.3s;} .eq i:nth-child(4){animation-delay:.45s;}
@keyframes eqb{0%,100%{height:4px;}50%{height:16px;}}
.music-btn.muted .eq i{animation-play-state:paused;height:4px;opacity:.45;}
.music-btn.muted::after{content:"";position:absolute;width:30px;height:2px;border-radius:2px;
  background:currentColor;transform:rotate(-45deg);opacity:.85;}

/* ══════════════ 1. CỬA SON ══════════════ */
.scene--gate{background:#08040f;perspective:1700px;perspective-origin:50% 44%;}
.gate-behind{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(125% 95% at 50% 20%,#4c2166 0%,#25103f 44%,#100722 74%,#06030f 100%);}
.gate-behind__moon{position:absolute;left:50%;top:24%;translate:-50% -50%;
  width:min(50vw,min(44vh,290px));aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#fffdf3,#ffeab8 44%,#f6cc74 76%,#d9a441 100%);
  box-shadow:0 0 80px 30px rgba(255,214,130,.34),0 0 200px 80px rgba(255,175,80,.2);
  transform:scale(.7);opacity:0;transition:transform 2.2s cubic-bezier(.2,.8,.3,1),opacity 1.6s ease;}
.scene--gate.is-open .gate-behind__moon{transform:scale(1);opacity:1;}
.gate-behind__glyphs{position:absolute;inset:0;}
.gate-behind__hill{position:absolute;left:-8%;right:-8%;bottom:-10%;height:34%;border-radius:50% 50% 0 0;
  background:linear-gradient(to top,#150a26,#2c1548);opacity:.95;}

.gate-panel{position:absolute;top:0;bottom:0;width:50.6%;z-index:3;
  background:
    linear-gradient(90deg,rgba(0,0,0,.4),transparent 20%,transparent 80%,rgba(0,0,0,.4)),
    repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 2px,transparent 2px 10px),
    linear-gradient(160deg,#cf1a33 0%,#a2101f 52%,#6f0716 100%);
  transition:transform 1900ms cubic-bezier(.58,.02,.22,1),filter 1900ms ease;
  will-change:transform;backface-visibility:hidden;}
.gate-panel--l{left:0;transform-origin:left center;box-shadow:inset -22px 0 40px rgba(0,0,0,.45);}
.gate-panel--r{right:0;transform-origin:right center;box-shadow:inset 22px 0 40px rgba(0,0,0,.45);}
.gate-panel::before{content:"";position:absolute;inset:16px;border:2px solid rgba(233,187,85,.36);border-radius:5px;}
.gate-panel::after{content:"";position:absolute;inset:30px;border:1px solid rgba(233,187,85,.2);}
.gate-stud{position:absolute;width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 34% 30%,#ffe7ab,#c99a38 60%,#8a5f1c);
  box-shadow:0 2px 5px rgba(0,0,0,.45);}
.gate-knock{position:absolute;top:57%;width:min(16vw,84px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 36% 30%,#ffe7ab,#cf9f3c 58%,#8a5f1c);
  box-shadow:0 6px 18px rgba(0,0,0,.5),inset 0 -4px 10px rgba(0,0,0,.35);
  display:grid;place-items:center;font-size:26px;color:#6f0716;}
.gate-panel--l .gate-knock{right:9%;}
.gate-panel--r .gate-knock{left:9%;}

.gate-seam{position:absolute;left:50%;top:0;bottom:0;width:4px;translate:-50% 0;z-index:4;
  background:linear-gradient(to bottom,transparent,var(--gold-lt) 10%,#fff8e0 50%,var(--gold-lt) 90%,transparent);
  box-shadow:0 0 26px 6px rgba(255,214,130,.65);transition:all 900ms ease;}
.scene--gate.is-open .gate-seam{width:60vw;opacity:0;filter:blur(30px);}

.gate-window{position:absolute;left:50%;top:44%;translate:-50% -50%;z-index:5;
  width:min(74vw,min(62vh,430px));aspect-ratio:1;
  transition:transform 1200ms cubic-bezier(.3,.9,.3,1),opacity 900ms ease;}
.gate-window svg{width:100%;height:100%;filter:drop-shadow(0 0 18px rgba(255,200,110,.6));}
.gate-window__halo{position:absolute;inset:-16%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle,rgba(255,196,96,.34),transparent 62%);
  animation:halo 4.6s ease-in-out infinite;}
@keyframes halo{0%,100%{opacity:.5;transform:scale(1);}50%{opacity:1;transform:scale(1.12);}}
.scene--gate.is-open .gate-window{transform:translate(-50%,-50%) scale(3.4) rotate(18deg);opacity:0;}

.gate-lantern{position:absolute;left:50%;top:44%;translate:-50% -50%;z-index:7;
  width:min(24vw,min(22vh,130px));border:0;background:none;padding:0;cursor:pointer;
  animation:lanternBob 4.2s ease-in-out infinite;
  transition:transform .42s cubic-bezier(.2,.9,.3,1.3),filter .42s ease;}
.gate-lantern svg{width:100%;height:auto;filter:drop-shadow(0 8px 30px rgba(255,90,50,.75));}
.gate-lantern:hover{transform:translate(-50%,-50%) scale(1.09);filter:brightness(1.14);}
.gate-lantern:active{transform:translate(-50%,-50%) scale(.93);}
.gate-lantern:focus-visible{outline:3px solid var(--gold-lt);outline-offset:10px;border-radius:16px;}
@keyframes lanternBob{0%,100%{transform:translate(-50%,-50%) translateY(0) rotate(-2.5deg);}
  50%{transform:translate(-50%,-50%) translateY(-10px) rotate(2.5deg);}}
.scene--gate.is-open .gate-lantern{animation:none;opacity:0;
  transform:translate(-50%,-50%) scale(5);transition:transform 1.3s ease-in,opacity 1s ease-in;}

.gate-hint{position:absolute;left:50%;translate:-50% 0;bottom:calc(var(--sb) + 9vh);z-index:8;
  margin:0;cursor:pointer;font-size:clamp(12px,3.4vw,15px);font-weight:700;letter-spacing:.24em;
  color:var(--gold-lt);text-shadow:0 0 20px rgba(255,190,90,.85);white-space:nowrap;
  animation:hintPulse 3s ease-in-out infinite;}
@keyframes hintPulse{0%,100%{opacity:.6;transform:translateY(0);}50%{opacity:1;transform:translateY(-6px);}}
.scene--gate.is-open .gate-hint{opacity:0;transform:translate(-50%,24px);transition:.5s;}

.scene--gate.is-open .gate-panel--l{transform:translateX(-3%) rotateY(-92deg);filter:brightness(.34);}
.scene--gate.is-open .gate-panel--r{transform:translateX(3%) rotateY(92deg);filter:brightness(.34);}

.gate-burst{position:absolute;left:50%;top:44%;translate:-50% -50%;z-index:6;
  width:10px;height:10px;border-radius:50%;pointer-events:none;opacity:0;
  background:radial-gradient(circle,#fffdf0,#ffd98a 28%,#ff8a3c 54%,rgba(200,40,20,0) 72%);}
.scene--gate.is-open .gate-burst{animation:gburst 1.9s cubic-bezier(.15,.75,.3,1) .25s forwards;}
@keyframes gburst{0%{opacity:0;transform:translate(-50%,-50%) scale(1);}
  14%{opacity:1;transform:translate(-50%,-50%) scale(26);}
  55%{opacity:.75;transform:translate(-50%,-50%) scale(70);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(130);}}

.spark-layer{position:absolute;inset:0;pointer-events:none;z-index:9;}
.gold-spark{position:absolute;left:50%;top:44%;border-radius:50%;
  background:radial-gradient(circle,#fff6d0,#f2b23f 58%,rgba(200,120,20,0));
  animation:sparkFly 1.9s cubic-bezier(.1,.7,.3,1) forwards;}
@keyframes sparkFly{0%{transform:translate(-50%,-50%) scale(.2);opacity:0;}
  10%{opacity:1;}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(var(--sc)) rotate(var(--rt));opacity:0;}}

/* ══════════════ 2. PHONG THƯ ══════════════ */
.scene--env{perspective:1400px;}
.env-sky{
  position:absolute;
  inset:0;
  background-image:url("images/Designer.png");
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;
}.env-sky__moon{position:absolute;left:50%;top:20%;translate:-50% -50%;width:min(42vw,250px);aspect-ratio:1;
  border-radius:50%;background:radial-gradient(circle at 38% 34%,#fffdf3,#ffeab8 44%,#f6cc74 76%,#d9a441 100%);
  box-shadow:0 0 70px 26px rgba(255,214,130,.3),0 0 180px 70px rgba(255,175,80,.16);}
.env-stage{position:absolute;inset:0;display:grid;place-items:center;
  padding:calc(var(--st) + 20px) 20px calc(var(--sb) + 20px);}
.env-holder{display:flex;flex-direction:column;align-items:center;gap:clamp(20px,5vh,40px);}

.envelope{position:relative;width:min(74vw,min(46vh,330px));aspect-ratio:1.5;border:0;padding:0;
  background:none;cursor:pointer;transform-style:preserve-3d;
  animation:envFloat 5s ease-in-out infinite;
  transition:transform .4s cubic-bezier(.2,.9,.3,1.3);}
@keyframes envFloat{0%,100%{transform:translateY(0) rotate(-1.4deg);}50%{transform:translateY(-14px) rotate(1.4deg);}}
.envelope:hover{transform:scale(1.045);}
.envelope:active{transform:scale(.96);}
.envelope:focus-visible{outline:3px solid var(--gold-lt);outline-offset:10px;border-radius:14px;}
.envelope__body{position:absolute;inset:0;border-radius:12px;
  background:linear-gradient(162deg,#fffaf0 0%,#fdeccd 46%,#f4d6a8 100%);
  box-shadow:0 28px 60px rgba(30,2,20,.6),0 0 0 2px rgba(233,187,85,.55),0 0 0 7px rgba(233,187,85,.14);}
.envelope__body::before{content:"";position:absolute;inset:10px;border:1px dashed rgba(180,120,60,.4);border-radius:7px;}
.envelope__body::after{content:"";position:absolute;left:0;bottom:0;width:100%;height:64%;
  background:linear-gradient(to top,rgba(200,140,70,.18),transparent);
  clip-path:polygon(0 100%,0 30%,50% 100%);}
.envelope__side{position:absolute;right:0;bottom:0;width:100%;height:64%;
  background:linear-gradient(to top,rgba(200,140,70,.16),transparent);
  clip-path:polygon(100% 100%,100% 30%,50% 100%);}
.envelope__flap{position:absolute;left:0;top:0;width:100%;height:62%;transform-origin:top center;
  background:linear-gradient(172deg,#fffdf6,#f6dcb2);clip-path:polygon(0 0,100% 0,50% 100%);
  box-shadow:0 8px 16px rgba(140,80,30,.16);
  transition:transform 1s cubic-bezier(.55,-0.25,.3,1.35);z-index:3;}
.envelope__seal{position:absolute;left:50%;top:54%;translate:-50% -50%;width:min(19vw,80px);aspect-ratio:1;
  z-index:4;transition:transform .8s ease,opacity .6s ease;}
.envelope__seal svg{width:100%;height:100%;filter:drop-shadow(0 6px 16px rgba(160,20,40,.6));}
.envelope__glow{position:absolute;inset:-26%;border-radius:50%;pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(255,206,120,.4),transparent 62%);
  animation:halo 4.4s ease-in-out infinite;}
.envelope__sheet{position:absolute;left:8%;right:8%;top:10%;height:78%;border-radius:8px;z-index:2;
  background:linear-gradient(180deg,#fffdf7,#fff3dd);opacity:0;
  box-shadow:0 -6px 22px rgba(160,100,40,.25);transform:translateY(24%) scale(.96);
  transition:transform 1s cubic-bezier(.2,.8,.3,1) .28s,opacity .5s ease .28s;}
.scene--env.is-opening .envelope{animation:none;transform:scale(1.02);}
.scene--env.is-opening .envelope__flap{transform:rotateX(-178deg);}
.scene--env.is-opening .envelope__seal{transform:translate(-50%,-50%) scale(1.8) rotate(24deg);opacity:0;}
.scene--env.is-opening .envelope__sheet{opacity:1;transform:translateY(-34%) scale(1);}
.scene--env.is-leaving .env-holder{opacity:0;transform:scale(2.4) translateY(-8%);filter:blur(10px);
  transition:opacity .8s ease-in,transform 1s cubic-bezier(.5,-0.2,.7,.4),filter .8s ease;}

.env-hint{margin:0;cursor:pointer;font-size:clamp(13px,3.6vw,16px);font-weight:700;letter-spacing:.14em;
  color:var(--gold-lt);text-shadow:0 0 18px rgba(255,190,90,.8);
  padding:11px 22px;border-radius:999px;border:1px solid rgba(233,187,85,.42);
  background:rgba(40,8,28,.4);backdrop-filter:blur(8px);animation:hintPulse 3s ease-in-out infinite;}
.scene--env.is-opening .env-hint{opacity:0;transform:translateY(20px);transition:.5s;}

/* ══════════════ 3. LÁ THƯ ══════════════ */
.scene--letter{overflow:hidden;perspective:1500px;}
.letter-sky{
  position:absolute;
  inset:0;
  background-image:url("images/Designer.png");
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;
}.letter-sky__moon{position:absolute;right:8%;top:6%;width:min(28vw,180px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 36% 32%,#fffdf3,#ffeaba 44%,#f6cd79 76%,#dcab4e 100%);
  box-shadow:0 0 60px 22px rgba(255,214,130,.28),0 0 160px 60px rgba(255,170,80,.14);
  animation:moonGlow 7s ease-in-out infinite;}
@keyframes moonGlow{0%,100%{filter:brightness(1);}50%{filter:brightness(1.14);}}
.letter-sky__hill{position:absolute;left:-6%;right:-6%;bottom:-8%;height:32%;border-radius:50% 50% 0 0;
  background:linear-gradient(to top,#170a2a,#2c1546);opacity:.92;}
.floaters{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.floater{position:absolute;opacity:0;animation:rise linear infinite;
  filter:drop-shadow(0 0 12px rgba(255,170,90,.7));}
@keyframes rise{0%{opacity:0;transform:translateY(0) rotate(-7deg) scale(.9);}
  10%{opacity:.9;}88%{opacity:.55;}100%{opacity:0;transform:translateY(-114vh) rotate(7deg) scale(1.05);}}

.letter-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--st) + 12px) 12px calc(var(--sb) + 12px);}
.letter-scroll{width:100%;max-width:560px;max-height:100%;overflow-y:auto;overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;padding:8px 6px 12px;
  scrollbar-width:thin;scrollbar-color:rgba(233,187,85,.5) transparent;}
.letter-scroll::-webkit-scrollbar{width:6px;}
.letter-scroll::-webkit-scrollbar-thumb{background:rgba(233,187,85,.5);border-radius:99px;}

.letter{position:relative;border-radius:24px;overflow:hidden;padding-bottom:26px;
  background:
    radial-gradient(60% 40% at 14% 6%,rgba(255,214,150,.20),transparent 60%),
    radial-gradient(52% 38% at 88% 94%,rgba(255,170,190,.16),transparent 60%),
    linear-gradient(176deg,#fffdf7 0%,#fff6e6 44%,#ffeed6 100%);
  box-shadow:0 30px 70px rgba(16,2,18,.7),0 0 0 1px rgba(255,255,255,.75) inset,
             0 0 0 5px rgba(233,187,85,.3),0 0 70px rgba(255,180,90,.16);
  opacity:0;transform:translateY(40px) scale(.94) rotateX(10deg);
  transform-style:preserve-3d;transition:transform .35s ease-out;}
.scene--letter.active .letter{opacity:1;transform:none;
  transition:opacity .95s cubic-bezier(.2,.8,.3,1) .15s,transform 1.05s cubic-bezier(.2,.8,.3,1.05) .15s;}
.letter::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:
    repeating-linear-gradient(0deg,rgba(180,140,90,.05) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(90deg,rgba(180,140,90,.04) 0 1px,transparent 1px 5px);}
.letter-sheen{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;
  background:linear-gradient(105deg,transparent 36%,rgba(255,255,255,.55) 48%,transparent 60%);
  transition:opacity .4s ease;}
.letter:hover .letter-sheen{opacity:.6;}

.letter-roof{position:relative;height:60px;background:linear-gradient(180deg,#d01b35,#8e0c22);
  display:grid;place-items:center;}
.letter-roof::before{content:"";position:absolute;left:0;right:0;top:0;height:100%;
  background:repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 16px,transparent 16px 32px);}
.letter-roof::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
  background:repeating-linear-gradient(90deg,#e9bb55 0 13px,#b98c2e 13px 26px);}
.letter-roof span{position:relative;font-size:12.5px;font-weight:700;letter-spacing:.26em;color:#ffe9ae;
  text-shadow:0 1px 8px rgba(0,0,0,.5);}
.letter-lamps{position:absolute;left:0;right:0;top:56px;display:flex;justify-content:space-around;
  padding:0 8%;pointer-events:none;z-index:3;}
.letter-lamps i{font-style:normal;font-size:20px;transform-origin:top center;
  animation:sway 3.6s ease-in-out infinite;filter:drop-shadow(0 4px 10px rgba(255,120,60,.5));}
.letter-lamps i:nth-child(2){animation-delay:.5s;font-size:16px;}
.letter-lamps i:nth-child(3){animation-delay:1s;}
.letter-lamps i:nth-child(4){animation-delay:1.5s;font-size:16px;}
@keyframes sway{0%,100%{transform:rotate(-12deg);}50%{transform:rotate(12deg);}}

.letter-inner{position:relative;z-index:1;padding:34px clamp(22px,5.6vw,38px) 0;}
.letter-cast{display:flex;align-items:flex-end;justify-content:center;gap:14px;margin:0 0 14px;}
.letter-cast span{font-size:clamp(28px,7.4vw,38px);line-height:1;cursor:default;
  transition:transform .3s cubic-bezier(.2,.9,.3,1.5);}
.letter-cast span:nth-child(1){animation:bobA 3.4s ease-in-out infinite;}
.letter-cast span:nth-child(2){font-size:clamp(38px,10vw,52px);animation:bobA 3.4s ease-in-out .4s infinite;}
.letter-cast span:nth-child(3){animation:bobA 3.4s ease-in-out .8s infinite;}
.letter-cast span:hover{transform:scale(1.35) rotate(-8deg);}
@keyframes bobA{0%,100%{transform:translateY(0) rotate(-5deg);}50%{transform:translateY(-11px) rotate(5deg);}}

.letter-label{margin:0 0 3px;text-align:center;font-size:12px;font-weight:700;letter-spacing:.2em;color:#c58f3e;}
.letter-heading{margin:2px 0 14px;text-align:center;font-family:var(--f-hand);font-weight:700;
  font-size:clamp(34px,9.6vw,52px);line-height:1.04;color:#b7194e;
  text-shadow:0 2px 0 rgba(255,255,255,.7);}
.letter-heading b{color:#e0357a;}
.letter-rule{display:flex;align-items:center;gap:12px;margin:0 0 20px;color:#dcae5a;}
.letter-rule::before,.letter-rule::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,transparent,rgba(220,174,90,.8),transparent);}
.letter-rule span{font-size:15px;}

.letter-body p{margin:0 0 15px;font-size:clamp(15px,4.1vw,16.8px);line-height:1.92;color:var(--ink-soft);
  font-weight:500;opacity:0;transform:translateY(14px);}
.letter-body p::first-letter{font-weight:700;color:#b7194e;}
.scene--letter.active .letter-body p{animation:lineIn .8s cubic-bezier(.2,.8,.3,1) forwards;}
.scene--letter.active .letter-body p:nth-child(1){animation-delay:.62s;}
.scene--letter.active .letter-body p:nth-child(2){animation-delay:.86s;}
.scene--letter.active .letter-body p:nth-child(3){animation-delay:1.1s;}
.scene--letter.active .letter-body p:nth-child(4){animation-delay:1.34s;}
.scene--letter.active .letter-body p:nth-child(5){animation-delay:1.58s;}
.scene--letter.active .letter-body p:nth-child(6){animation-delay:1.82s;}
.scene--letter.active .letter-body p:nth-child(7){animation-delay:2.06s;}
@keyframes lineIn{to{opacity:1;transform:none;}}

.letter-sign{margin-top:22px;text-align:right;position:relative;}
.letter-sign small{display:block;font-size:11.5px;color:#b08a68;letter-spacing:.12em;}
.letter-sign strong{font-family:var(--f-hand);font-size:36px;color:#c02f68;font-weight:700;}
.letter-stamp{position:absolute;left:0;bottom:-6px;width:62px;height:62px;border-radius:50%;
  display:grid;place-items:center;font-size:26px;
  border:2px dashed rgba(190,30,70,.42);color:#c4152f;transform:rotate(-14deg);opacity:.75;}

.cta{margin:24px clamp(22px,5.6vw,38px) 0;width:calc(100% - 2*clamp(22px,5.6vw,38px));
  position:relative;overflow:hidden;border:0;cursor:pointer;color:#fff8e8;font-weight:700;
  font-size:clamp(15px,4.2vw,17px);padding:17px 20px;border-radius:999px;
  background:linear-gradient(120deg,#e8426b,#c4152f 48%,#8e0c22);
  box-shadow:0 14px 32px rgba(140,10,40,.5),0 0 0 2px rgba(233,187,85,.6) inset;
  opacity:0;transform:translateY(16px);transition:transform .26s ease,box-shadow .26s ease,filter .26s ease;}
.cta::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);
  animation:shine 3.4s ease-in-out 2.6s infinite;}
@keyframes shine{0%{left:-60%;}55%,100%{left:130%;}}
.scene--letter.active .cta{animation:lineIn .8s cubic-bezier(.2,.8,.3,1) 2.3s forwards;}
.cta:hover{transform:translateY(-3px) scale(1.015);filter:brightness(1.09);
  box-shadow:0 20px 42px rgba(140,10,40,.62),0 0 0 2px rgba(255,233,174,.9) inset;}
.cta:active{transform:scale(.97);}
.cta:disabled{filter:saturate(.5);cursor:default;}
.cta:focus-visible{outline:3px solid var(--gold-lt);outline-offset:4px;}

.scene--letter.is-leaving .letter{
  animation:foldUp 1.35s cubic-bezier(.55,-0.05,.4,1) forwards;transform-origin:50% 40%;}
@keyframes foldUp{
  0%{opacity:1;transform:none;}
  32%{opacity:1;transform:rotateX(46deg) scale(.82) translateY(-4%);filter:brightness(1.2);}
  100%{opacity:0;transform:rotateX(78deg) scale(.10) translateY(-62vh);filter:brightness(2.4) blur(4px);}}

@media (orientation:landscape) and (min-aspect-ratio:13/10){
  .letter-scroll{max-width:860px;}
  .letter-inner{padding:34px 44px 0;}
  .letter-grid{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.35fr);gap:34px;align-items:center;}
  .letter-cast{flex-direction:column;gap:16px;margin:0;}
  .letter-cast span{font-size:54px;}
  .letter-cast span:nth-child(2){font-size:70px;}
  .letter-heading,.letter-label{text-align:left;}
  .cta{margin:22px 44px 0;width:calc(100% - 88px);}
  .letter-body p{font-size:16px;}
}

/* ══════════════ WARP + FLASH ══════════════ */
.warp{position:fixed;inset:0;z-index:58;pointer-events:none;opacity:0;overflow:hidden;
  background:radial-gradient(circle at 50% 50%,rgba(20,4,24,0) 26%,rgba(8,2,14,.92) 78%);}
.warp.on{opacity:1;transition:opacity .3s ease;}
.warp i{position:absolute;left:50%;top:50%;width:2px;height:8vh;border-radius:2px;transform-origin:50% 0;
  background:linear-gradient(to bottom,rgba(255,235,190,0),rgba(255,226,170,.95),rgba(255,120,170,0));
  animation:streak 1.15s cubic-bezier(.4,0,.7,1) forwards;}
@keyframes streak{0%{transform:rotate(var(--a)) translateY(0) scaleY(.15);opacity:0;}
  18%{opacity:1;}100%{transform:rotate(var(--a)) translateY(95vmax) scaleY(3.2);opacity:0;}}
.flash{position:fixed;inset:0;z-index:60;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,#fffdf4 0%,#ffd9a0 18%,#ff5f8e 40%,rgba(50,0,36,0) 74%);}
.flash.fire{animation:flashGo 1.25s cubic-bezier(.2,.8,.3,1) forwards;}
@keyframes flashGo{0%{opacity:0;transform:scale(.05);}16%{opacity:1;transform:scale(1.05);}
  40%{opacity:.92;transform:scale(1.45);}100%{opacity:0;transform:scale(2.8);}}

/* ══════════════ 4. THIÊN HÀ ══════════════ */
.scene--galaxy{background:#05020c;}
#galaxy-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
.galaxy-vig{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(130% 100% at 50% 52%,transparent 40%,rgba(5,1,10,.84) 100%);}
.galaxy-head{position:absolute;left:0;right:0;top:calc(var(--st) + 18px);z-index:5;text-align:center;
  pointer-events:none;padding:0 68px;opacity:0;transform:translateY(-12px);
  transition:opacity 1.3s ease 2.4s,transform 1.3s ease 2.4s;}
.scene--galaxy.is-ready .galaxy-head{opacity:1;transform:none;}
.galaxy-head h2{margin:0;font-family:var(--f-disp);font-style:italic;font-weight:600;
  font-size:clamp(20px,5.4vw,34px);color:#ffeccd;
  text-shadow:0 0 22px rgba(255,180,90,.7),0 0 54px rgba(255,90,150,.45);}
.galaxy-head p{margin:7px 0 0;font-size:clamp(11.5px,3.1vw,14px);font-weight:600;
  color:rgba(255,215,180,.76);letter-spacing:.07em;}
.galaxy-hint{position:absolute;left:50%;translate:-50% 0;bottom:calc(var(--sb) + 20px);z-index:5;
  padding:10px 20px;border-radius:999px;font-size:clamp(11.5px,3.1vw,13.5px);font-weight:600;color:#ffe5c6;
  background:rgba(50,6,32,.5);border:1px solid rgba(233,187,85,.42);backdrop-filter:blur(8px);
  white-space:nowrap;opacity:0;transition:opacity 1.3s ease 3.1s;pointer-events:none;max-width:92vw;
  overflow:hidden;text-overflow:ellipsis;}
.scene--galaxy.is-ready .galaxy-hint{opacity:1;}
.loading{position:absolute;inset:0;display:grid;place-items:center;z-index:8;color:#ffd5a8;
  font-size:13px;font-weight:700;letter-spacing:.24em;transition:opacity .7s ease;}
.loading.gone{opacity:0;pointer-events:none;}

/* ══════════════ MODAL ══════════════ */
.modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  padding:calc(var(--st) + 16px) 16px calc(var(--sb) + 16px);
  opacity:0;visibility:hidden;transition:opacity .4s ease,visibility .4s;}
.modal.is-open{opacity:1;visibility:visible;}
.modal__bd{position:absolute;inset:0;background:rgba(12,2,14,.86);backdrop-filter:blur(14px);}
.modal__card{position:relative;width:min(94vw,420px);max-height:100%;overflow-y:auto;
  overscroll-behavior:contain;border-radius:24px;text-align:center;
  background:linear-gradient(170deg,#76132f 0%,#4d0a26 46%,#2c0617 100%);
  box-shadow:0 30px 80px rgba(0,0,0,.78),0 0 0 2px rgba(233,187,85,.6),
             0 0 0 8px rgba(233,187,85,.13),0 0 80px rgba(255,120,60,.2);
  transform:scale(.82) translateY(22px);transition:transform .52s cubic-bezier(.2,.9,.25,1.14);
  scrollbar-width:thin;scrollbar-color:rgba(233,187,85,.5) transparent;}
.modal.is-open .modal__card{transform:none;}
.modal__card::-webkit-scrollbar{width:5px;}
.modal__card::-webkit-scrollbar-thumb{background:rgba(233,187,85,.5);border-radius:99px;}
.modal__top{padding:28px 24px 20px;position:relative;}
.modal__top::after{content:"";position:absolute;left:24px;right:24px;bottom:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(233,187,85,.65),transparent);}
.modal__tag{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.2em;color:#e9bb55;margin-bottom:10px;}
.modal__icon{font-size:42px;line-height:1;filter:drop-shadow(0 0 18px rgba(255,150,70,.85));
  animation:bobA 3.4s ease-in-out infinite;}
.modal__title{margin:10px 0 9px;font-family:var(--f-hand);font-weight:700;font-size:31px;color:#ffe3b8;}
.modal__text{margin:0;font-size:15px;line-height:1.82;font-weight:500;color:rgba(255,231,214,.92);}
.modal__photo{margin:0;padding:18px 20px 22px;}
.modal__frame{position:relative;border-radius:16px;overflow:hidden;background:#2a0515;
  box-shadow:0 0 0 2px rgba(233,187,85,.75),0 0 0 8px rgba(233,187,85,.12),0 16px 34px rgba(0,0,0,.55);}
.modal__frame img{width:100%;aspect-ratio:4/5;object-fit:cover;background:#2a0515;}
.modal__frame.is-empty img{display:none;}
.modal__ph{display:none;aspect-ratio:4/5;place-items:center;gap:10px;color:rgba(255,214,150,.6);
  background:repeating-linear-gradient(135deg,#3a0a1e 0 14px,#33081a 14px 28px);}
.modal__frame.is-empty .modal__ph{display:grid;}
.modal__ph b{font-size:46px;font-weight:400;}
.modal__ph small{font-size:11px;letter-spacing:.12em;font-weight:700;}
.modal__cap{margin:11px 0 0;font-size:12.5px;font-weight:600;letter-spacing:.06em;color:rgba(255,205,150,.74);}
.modal__close{position:absolute;top:12px;right:12px;z-index:3;width:36px;height:36px;border-radius:50%;
  cursor:pointer;border:1px solid rgba(233,187,85,.5);background:rgba(20,2,12,.6);color:#ffdcb0;font-size:15px;}
.modal__close:hover{background:rgba(233,187,85,.3);}
@media (orientation:landscape) and (min-aspect-ratio:13/10){
  .modal__card{width:min(92vw,730px);}
  .modal__grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.85fr);align-items:center;}
  .modal__top{padding:30px 26px;}
  .modal__top::after{left:auto;right:0;top:26px;bottom:26px;width:1px;height:auto;
    background:linear-gradient(180deg,transparent,rgba(233,187,85,.55),transparent);}
  .modal__photo{padding:22px 24px;}
  .modal__frame img,.modal__ph{aspect-ratio:1/1;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.2s !important;}
}
/* Ảnh trong khoảng trống bên trái lá thư */

.letter-photo-frame {
  position: relative;

  width: min(240px, 100%);
  aspect-ratio: 4 / 5;

  padding: 9px;
  overflow: hidden;

  border: 3px solid rgba(233, 187, 85, 0.9);
  border-radius: 22px;

  background: linear-gradient(
    145deg,
    #fff9e9,
    #f1cf82
  );

  box-shadow:
    0 18px 35px rgba(70, 20, 35, 0.3),
    0 0 28px rgba(233, 187, 85, 0.35);

  transform: rotate(-2deg);

  transition:
    transform 400ms ease,
    box-shadow 400ms ease;
}

.letter-photo-frame:hover {
  transform:
    rotate(0deg)
    translateY(-5px)
    scale(1.02);

  box-shadow:
    0 24px 42px rgba(70, 20, 35, 0.38),
    0 0 40px rgba(233, 187, 85, 0.55);
}

.letter-photo {
  display: block;

  width: 100%;
  height: 100%;

  border-radius: 14px;

  object-fit: cover;
  object-position: center;
}

.letter-photo-shine {
  position: absolute;
  inset: 9px;

  border-radius: 14px;

  pointer-events: none;

  background: linear-gradient(
    115deg,
    transparent 25%,
    rgba(255, 255, 255, 0.45) 47%,
    transparent 68%
  );

  transform: translateX(-160%);

  animation: letterPhotoShine 4.5s ease-in-out infinite;
}

.letter-photo-icons {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;

  margin-top: 15px;
}

.letter-photo-icons span {
  font-size: clamp(24px, 5vw, 36px);

  filter: drop-shadow(
    0 5px 7px rgba(80, 30, 30, 0.25)
  );

  animation: letterPhotoIconFloating 3s ease-in-out infinite;
}

.letter-photo-icons span:nth-child(2) {
  animation-delay: 0.4s;
}

.letter-photo-icons span:nth-child(3) {
  animation-delay: 0.8s;
}

@keyframes letterPhotoShine {
  0%,
  45% {
    transform: translateX(-160%);
  }

  70%,
  100% {
    transform: translateX(160%);
  }
}

@keyframes letterPhotoIconFloating {
  0%,
  100% {
    transform: translateY(0) rotate(-3deg);
  }

  50% {
    transform: translateY(-7px) rotate(3deg);
  }
}

@media screen and (max-width: 600px) {
  .letter-photo-frame {
    width: min(68vw, 250px);
    margin: 0 auto 16px;
  }

  .letter-photo-icons {
    margin-bottom: 18px;
  }
}
</style>

<div class="letter-cast">

<script>
/* ══════════════════════════════════════════════════════════════════════
   ⬇⬇⬇   KHU VỰC CHỈNH NỘI DUNG — CHỈ SỬA TRONG KHỐI NÀY   ⬇⬇⬇
   ══════════════════════════════════════════════════════════════════════ */
const CONTENT = {

const Music = (function(){
  let audio=null, enabled=false, unlocked=false;
  const btn=document.getElementById('music-btn');

  if(CONTENT.music){
    audio=new Audio(CONTENT.music);
    audio.loop = CONTENT.musicLoop !== false;
    audio.volume = 0;
    audio.preload='auto';
    btn.classList.add('show','muted');
  }

  function fadeTo(target, ms){
    if(!audio) return;
    const from=audio.volume, t0=performance.now();
    (function step(now){
      const k=Math.min(1,(now-t0)/ms);
      audio.volume=Math.max(0,Math.min(1,from+(target-from)*k));
      if(k<1) requestAnimationFrame(step);
    })(t0);
  }
  function vol(){ return (typeof CONTENT.musicVolume==='number')?CONTENT.musicVolume:0.45; }

  function unlock(){
    if(!audio||unlocked) return;
    unlocked=true;
    audio.play().then(()=>{
      enabled=true; btn.classList.remove('muted'); fadeTo(vol(),1400);
    }).catch(()=>{ unlocked=false; });
  }

  btn.addEventListener('click',()=>{
    if(!audio) return;
    if(!unlocked){ unlock(); return; }
    if(enabled){ fadeTo(0,450); setTimeout(()=>audio.pause(),470); enabled=false; btn.classList.add('muted'); }
    else{ audio.play().catch(()=>{}); fadeTo(vol(),800); enabled=true; btn.classList.remove('muted'); }
  });
  return { unlock };
})();

const Galaxy = (function(){
  let renderer,scene,camera,clock,spinGroup;
  let heartPoints,diskPoints,textPoints,beamPoints,starPoints;
  let moonSprite,lanterns=[],hearts=[];
  let raycaster,pointer,hovered=null;
  let running=false,started=false;
  let targetSpin=0,elevation=0.06,targetElevation=0.44,dist=46,targetDist=34;

  const SMALL=Math.min(innerWidth,innerHeight)<680;
  const N={heart:SMALL?13000:23000,disk:SMALL?9000:16000,stars:SMALL?1200:2400,beam:SMALL?700:1200};

  const VERT=[
    'attribute float aSize; attribute vec3 aColor; attribute vec3 aStart;',
    'attribute float aDelay; attribute float aSpeed; attribute float aPhase;',
    'uniform float uTime,uPixelRatio,uScale,uTwinkle;',
    'varying vec3 vColor; varying float vAlpha;',
    'float easeOut(float x){ return 1.0-pow(1.0-x,3.0); }',
    'void main(){',
    '  float t=clamp((uTime-aDelay)*aSpeed,0.0,1.0);',
    '  vec3 pos=mix(aStart,position,easeOut(t));',
    '  vColor=aColor;',
    '  vAlpha=(0.55+0.45*sin(uTime*2.1+aPhase))*uTwinkle+(1.0-uTwinkle);',
    '  vAlpha*=0.22+0.78*t;',
    '  vec4 mv=modelViewMatrix*vec4(pos,1.0);',
    '  gl_PointSize=aSize*uScale*uPixelRatio*(260.0/max(-mv.z,0.1));',
    '  gl_Position=projectionMatrix*mv;',
    '}'
  ].join('\n');

  const FRAG=[
    'uniform float uOpacity,uBoost;',
    'varying vec3 vColor; varying float vAlpha;',
    'void main(){',
    '  float d=length(gl_PointCoord-vec2(0.5));',
    '  float core=smoothstep(0.5,0.0,d);',
    '  float glow=pow(core,3.2);',
    '  float a=glow*vAlpha*uOpacity;',
    '  if(a<0.006) discard;',
    '  gl_FragColor=vec4(vColor*(0.5+uBoost*glow),a);',
    '}'
  ].join('\n');

  function mat(scale,twinkle,opacity,boost){
    return new THREE.ShaderMaterial({
      vertexShader:VERT,fragmentShader:FRAG,
      uniforms:{uTime:{value:0},uPixelRatio:{value:Math.min(devicePixelRatio||1,2)},
        uScale:{value:scale},uTwinkle:{value:twinkle},uOpacity:{value:opacity},uBoost:{value:boost}},
      transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending});
  }

  function geo(list){
    const n=list.length;
    const pos=new Float32Array(n*3),col=new Float32Array(n*3),st=new Float32Array(n*3);
    const sz=new Float32Array(n),dl=new Float32Array(n),sp=new Float32Array(n),ph=new Float32Array(n);
    for(let i=0;i<n;i++){
      const p=list[i];
      pos[i*3]=p.pos[0];pos[i*3+1]=p.pos[1];pos[i*3+2]=p.pos[2];
      col[i*3]=p.color[0];col[i*3+1]=p.color[1];col[i*3+2]=p.color[2];
      st[i*3]=p.start[0];st[i*3+1]=p.start[1];st[i*3+2]=p.start[2];
      sz[i]=p.size;dl[i]=p.delay;sp[i]=p.speed;ph[i]=Math.random()*6.283;
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    g.setAttribute('aColor',new THREE.BufferAttribute(col,3));
    g.setAttribute('aStart',new THREE.BufferAttribute(st,3));
    g.setAttribute('aSize',new THREE.BufferAttribute(sz,1));
    g.setAttribute('aDelay',new THREE.BufferAttribute(dl,1));
    g.setAttribute('aSpeed',new THREE.BufferAttribute(sp,1));
    g.setAttribute('aPhase',new THREE.BufferAttribute(ph,1));
    return g;
  }
  function chaos(R){
    const u=Math.random()*2-1,th=Math.random()*6.283,s=Math.sqrt(1-u*u),r=R*(0.55+Math.random()*0.45);
    return [r*s*Math.cos(th),r*u*0.7+4,r*s*Math.sin(th)];
  }
  function hf(x,y,z){ const a=x*x+2.25*z*z+y*y-1; return a*a*a-x*x*y*y*y-0.1125*z*z*y*y*y; }
  function hBound(dx,dy,dz){
    let lo=0.05,hi=1.7;
    for(let i=0;i<20;i++){ const m=(lo+hi)/2; if(hf(dx*m,dy*m,dz*m)<0) lo=m; else hi=m; }
    return lo;
  }

  function buildHeart(){
    const L=[],S=4.0,CY=9.2;
    const pal=[[1,.80,.88],[1,.62,.78],[.99,.40,.64],[.92,.22,.52],[.74,.12,.42],[.52,.07,.33]];
    const goldc=[1,.84,.52];
    for(let i=0;i<N.heart;i++){
      const u=Math.random()*2-1,th=Math.random()*6.283,s=Math.sqrt(1-u*u);
      const dx=s*Math.cos(th),dy=u,dz=s*Math.sin(th);
      const b=hBound(dx,dy,dz),shell=Math.random()<0.72;
      const k=shell?0.91+Math.random()*0.09:Math.pow(Math.random(),0.5)*0.91;
      const r=b*k,j=0.014*S;
      const x=dx*r*S+(Math.random()-.5)*j,y=dy*r*S+(Math.random()-.5)*j,z=dz*r*S*0.70+(Math.random()-.5)*j;
      let c;
      if(shell&&Math.random()<0.14) c=goldc;
      else { const idx=shell?Math.floor(Math.random()*3):2+Math.floor(Math.random()*4); c=pal[Math.min(idx,5)]; }
      L.push({pos:[x,y+CY,z],color:c,size:(shell?0.9:0.7)+Math.random()*1.5,
              start:chaos(52),delay:Math.random()*1.5,speed:0.34+Math.random()*0.4});
    }
    return L;
  }

  function buildDisk(){
    const L=[],BR=5,IN=1.5,OUT=17.5,SPIN=0.24,SPREAD=0.62;
    const hot=new THREE.Color('#ffe7b8'),mid=new THREE.Color('#ff3f8e'),edge=new THREE.Color('#3d0530');
    const t=new THREE.Color();
    for(let i=0;i<N.disk;i++){
      const rn=Math.pow(Math.random(),1.7),R=IN+rn*(OUT-IN),a=(i%BR)/BR*6.283+R*SPIN,P=2.6;
      const sx=Math.pow(Math.random(),P)*(Math.random()<.5?1:-1)*SPREAD*R*0.34;
      const sy=Math.pow(Math.random(),P)*(Math.random()<.5?1:-1)*SPREAD*0.40;
      const sz=Math.pow(Math.random(),P)*(Math.random()<.5?1:-1)*SPREAD*R*0.34;
      if(rn<0.45) t.copy(hot).lerp(mid,rn/0.45); else t.copy(mid).lerp(edge,(rn-0.45)/0.55*0.9);
      L.push({pos:[Math.cos(a)*R+sx,sy*(1+rn*1.4),Math.sin(a)*R+sz],
              color:[t.r,t.g,t.b],size:0.75+Math.random()*1.5+(rn<0.12?1.1:0),
              start:chaos(46),delay:Math.random()*0.8,speed:0.42+Math.random()*0.5});
    }
    for(let i=0;i<(SMALL?500:900);i++){
      const r=Math.pow(Math.random(),2.2)*1.9,th=Math.random()*6.283;
      L.push({pos:[Math.cos(th)*r,(Math.random()-.5)*0.5,Math.sin(th)*r],color:[1,.90,.72],
              size:1.2+Math.random()*2.0,start:chaos(40),delay:Math.random()*0.5,speed:0.5+Math.random()*0.5});
    }
    return L;
  }

  function buildStars(){
    const L=[];
    for(let i=0;i<N.stars;i++){
      const u=Math.random()*2-1,th=Math.random()*6.283,s=Math.sqrt(1-u*u),r=54+Math.random()*46;
      const p=[r*s*Math.cos(th),r*u,r*s*Math.sin(th)],w=Math.random();
      L.push({pos:p,color:w<.5?[1,.90,.72]:(w<.85?[1,.60,.80]:[.82,.80,1]),
              size:0.6+Math.random()*1.4,start:p,delay:0,speed:3});
    }
    return L;
  }

  function buildBeam(){
    const L=[],TOP=6.5,BOT=0.2;
    for(let i=0;i<N.beam;i++){
      const t=Math.pow(Math.random(),0.75),y=BOT+t*(TOP-BOT),w=0.26+Math.pow(t,2.1)*1.8;
      const th=Math.random()*6.283,r=Math.pow(Math.random(),0.6)*w;
      L.push({pos:[Math.cos(th)*r,y,Math.sin(th)*r],color:t>0.5?[1,.62,.80]:[1,.88,.66],
              size:0.65+Math.random()*1.4,start:chaos(30),delay:0.6+Math.random()*0.6,speed:0.4+Math.random()*0.4});
    }
    return L;
  }

  function sampleText(txt,px){
    const cv=document.createElement('canvas'),cx=cv.getContext('2d');
    const font='700 '+px+'px "Quicksand", Arial, sans-serif';
    cx.font=font;
    const w=Math.ceil(cx.measureText(txt).width)+26,h=Math.ceil(px*1.7);
    cv.width=w;cv.height=h;cx.font=font;cx.fillStyle='#fff';cx.textBaseline='middle';
    cx.fillText(txt,13,h/2);
    const d=cx.getImageData(0,0,w,h).data,pts=[];
    for(let y=0;y<h;y+=2) for(let x=0;x<w;x+=2) if(d[(y*w+x)*4+3]>140) pts.push([x-w/2,y-h/2]);
    return {pts:pts,w:w};
  }
  function buildTexts(){
    const L=[],n=CONTENT.orbitTexts.length;
    CONTENT.orbitTexts.forEach(function(txt,i){
      const r0=sampleText(txt,34),R=9.6+(i%3)*3.0;
      const base=(i/n)*6.283+Math.random()*0.4,U=0.030,startA=base-((r0.w*U)/R)/2;
      r0.pts.forEach(function(pt){
        if(Math.random()>0.88) return;
        const a=startA+((pt[0]+r0.w/2)*U)/R, rr=R-pt[1]*U;
        L.push({pos:[Math.cos(a)*rr+(Math.random()-.5)*0.05,0.34+(Math.random()-.5)*0.14,Math.sin(a)*rr+(Math.random()-.5)*0.05],
                color:[1,0.86+Math.random()*0.12,0.68],size:1.0+Math.random()*1.1,
                start:chaos(44),delay:1.2+Math.random()*0.9,speed:0.42+Math.random()*0.4});
      });
    });
    return L;
  }

  function tex(draw,S){
    const cv=document.createElement('canvas'); cv.width=cv.height=S;
    draw(cv.getContext('2d'),S);
    const t=new THREE.CanvasTexture(cv); t.needsUpdate=true; return t;
  }
  function moonTex(){ return tex(function(cx,S){
    const g=cx.createRadialGradient(S*.5,S*.5,S*.16,S*.5,S*.5,S*.5);
    g.addColorStop(0,'rgba(255,248,222,.95)');g.addColorStop(.42,'rgba(255,226,160,.85)');
    g.addColorStop(.58,'rgba(255,190,110,.30)');g.addColorStop(1,'rgba(255,160,70,0)');
    cx.fillStyle=g;cx.fillRect(0,0,S,S);
    cx.globalAlpha=.1;cx.fillStyle='#c79a4a';
    [[.42,.40,.07],[.58,.52,.05],[.47,.60,.045],[.60,.38,.035]].forEach(function(c){
      cx.beginPath();cx.arc(S*c[0],S*c[1],S*c[2],0,6.283);cx.fill();});
  },256); }
  function lanternTex(){ return tex(function(cx,S){
    const g=cx.createRadialGradient(S/2,S/2,2,S/2,S/2,S/2);
    g.addColorStop(0,'rgba(255,170,80,.5)');g.addColorStop(1,'rgba(255,90,40,0)');
    cx.fillStyle=g;cx.fillRect(0,0,S,S);
    cx.save();cx.translate(S/2,S/2);
    const w=S*.2,h=S*.26;
    const lg=cx.createRadialGradient(-w*.3,-h*.3,2,0,0,w*1.5);
    lg.addColorStop(0,'#fff2c6');lg.addColorStop(.42,'#ff9a3c');lg.addColorStop(1,'#d1201f');
    cx.fillStyle=lg;cx.beginPath();cx.ellipse(0,0,w,h,0,0,6.283);cx.fill();
    cx.fillStyle='#b8862c';
    cx.fillRect(-w*.72,-h-S*.028,w*1.44,S*.03);
    cx.fillRect(-w*.72,h,w*1.44,S*.03);
    cx.strokeStyle='rgba(255,220,150,.75)';cx.lineWidth=S*.012;
    cx.beginPath();cx.moveTo(0,h+S*.03);cx.lineTo(0,h+S*.1);cx.stroke();
    cx.restore();
  },192); }
  function heartTex(){ return tex(function(cx,S){
    const g=cx.createRadialGradient(S/2,S/2,2,S/2,S/2,S/2);
    g.addColorStop(0,'rgba(255,120,175,.42)');g.addColorStop(1,'rgba(255,50,130,0)');
    cx.fillStyle=g;cx.fillRect(0,0,S,S);
    cx.save();cx.translate(S/2,S/2+S*.045);cx.scale(S/42,S/42);
    cx.beginPath();
    for(let t=0;t<=6.30;t+=0.02){
      const x=16*Math.pow(Math.sin(t),3);
      const y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t));
      if(t===0) cx.moveTo(x*.9,y*.9); else cx.lineTo(x*.9,y*.9);
    }
    cx.closePath();
    const hg=cx.createRadialGradient(-4,-5,1,0,0,18);
    hg.addColorStop(0,'#ffe2ef');hg.addColorStop(.38,'#ff5b9e');hg.addColorStop(1,'#a80a52');
    cx.fillStyle=hg;cx.fill();
    cx.lineWidth=1.1;cx.strokeStyle='rgba(255,220,150,.9)';cx.stroke();
    cx.restore();
  },160); }

  function init(){
    const canvas=document.getElementById('galaxy-canvas');
    renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:!SMALL,alpha:false,powerPreference:'high-performance'});
    renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
    renderer.setSize(innerWidth,innerHeight);
    renderer.setClearColor(0x05020c,1);
    scene=new THREE.Scene();
    camera=new THREE.PerspectiveCamera(56,innerWidth/innerHeight,0.1,400);
    clock=new THREE.Clock();
    spinGroup=new THREE.Group(); scene.add(spinGroup);

    starPoints =new THREE.Points(geo(buildStars()),mat(0.52,1.00,0.85,0.85));
    diskPoints =new THREE.Points(geo(buildDisk()), mat(0.50,0.45,0.80,0.80));
    beamPoints =new THREE.Points(geo(buildBeam()), mat(0.44,0.80,0.55,0.60));
    heartPoints=new THREE.Points(geo(buildHeart()),mat(0.40,0.35,0.52,0.55));
    textPoints =new THREE.Points(geo(buildTexts()),mat(0.56,0.60,0.85,0.85));
    scene.add(starPoints);
    spinGroup.add(diskPoints,textPoints);
    scene.add(beamPoints,heartPoints);

    moonSprite=new THREE.Sprite(new THREE.SpriteMaterial({map:moonTex(),transparent:true,
      depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending,opacity:0}));
    moonSprite.position.set(-17,20,-34); moonSprite.scale.set(19,19,1); moonSprite.renderOrder=-5;
    scene.add(moonSprite);

    const lt=lanternTex();
    for(let i=0;i<(SMALL?12:20);i++){
      const s=new THREE.Sprite(new THREE.SpriteMaterial({map:lt,transparent:true,
        depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending,opacity:0}));
      const a=Math.random()*6.283,r=8+Math.random()*22;
      s.position.set(Math.cos(a)*r,1+Math.random()*10,Math.sin(a)*r);
      const sc=1.6+Math.random()*1.9; s.scale.set(sc,sc,1); s.renderOrder=5;
      s.userData={phase:Math.random()*6.283,speed:0.22+Math.random()*0.35,
                  base:s.position.y,x:s.position.x,drift:Math.random()*6.283};
      scene.add(s); lanterns.push(s);
    }

    const ht=heartTex();
    CONTENT.hearts.forEach(function(d,i){
      const s=new THREE.Sprite(new THREE.SpriteMaterial({map:ht,transparent:true,
        depthWrite:false,depthTest:false,blending:THREE.NormalBlending,opacity:0}));
      const a=(i/CONTENT.hearts.length)*6.283+0.35,r=12.6+(i%3)*1.8;
      s.position.set(Math.cos(a)*r,1.0+(i%2)*0.7,Math.sin(a)*r);
      const sc=2.7+(i%3)*0.3; s.scale.set(sc,sc,1); s.renderOrder=20;
      s.userData={data:d,base:s.position.y,phase:Math.random()*6.283,sc:sc,pulse:0};
      spinGroup.add(s); hearts.push(s);
    });

    raycaster=new THREE.Raycaster(); pointer=new THREE.Vector2(10,10);
    bind(canvas);
    addEventListener('resize',onResize);
    onResize();
  }

  function onResize(){
    const w=innerWidth,h=innerHeight,portrait=h>w;
    renderer.setSize(w,h);
    camera.aspect=w/h;
    camera.fov=portrait?64:48;
    targetDist=portrait?34:27;
    camera.updateProjectionMatrix();
    const pr=Math.min(devicePixelRatio||1,2);
    [starPoints,diskPoints,beamPoints,heartPoints,textPoints].forEach(function(p){
      if(p) p.material.uniforms.uPixelRatio.value=pr; });
  }

  function bind(canvas){
    let drag=false,moved=0,lx=0,ly=0,vx=0;
    canvas.addEventListener('pointerdown',function(e){
      drag=true;moved=0;lx=e.clientX;ly=e.clientY;vx=0;canvas.setPointerCapture(e.pointerId);});
    canvas.addEventListener('pointermove',function(e){
      pointer.x=(e.clientX/innerWidth)*2-1;
      pointer.y=-(e.clientY/innerHeight)*2+1;
      if(!drag) return;
      const dx=e.clientX-lx,dy=e.clientY-ly;
      moved+=Math.abs(dx)+Math.abs(dy); vx=dx;
      targetSpin-=dx*0.0042;
      targetElevation=Math.max(0.06,Math.min(1.0,targetElevation+dy*0.003));
      lx=e.clientX;ly=e.clientY;});
    canvas.addEventListener('pointerup',function(e){
      if(drag){ if(moved<9) pick(e); else targetSpin-=vx*0.02; }
      drag=false;});
    canvas.addEventListener('pointercancel',function(){drag=false;});
    canvas.addEventListener('wheel',function(e){
      e.preventDefault();
      targetDist=Math.max(14,Math.min(52,targetDist+e.deltaY*0.02));},{passive:false});
  }

  function pick(e){
    pointer.x=(e.clientX/innerWidth)*2-1;
    pointer.y=-(e.clientY/innerHeight)*2+1;
    raycaster.setFromCamera(pointer,camera);
    const hit=raycaster.intersectObjects(hearts,false);
    if(hit.length){
      const s=hit[0].object;
      s.userData.pulse=1;
      spawn('ripple',e.clientX,e.clientY,800);
      openModal(s.userData.data);
    }
  }

  function tick(){
    if(!running) return;
    requestAnimationFrame(tick);
    const t=clock.getElapsedTime();

    [starPoints,diskPoints,beamPoints,heartPoints,textPoints].forEach(function(p){
      p.material.uniforms.uTime.value=t; });

    targetSpin+=0.0011;
    spinGroup.rotation.y+=(targetSpin-spinGroup.rotation.y)*0.07;
    starPoints.rotation.y=spinGroup.rotation.y*0.2;

    const rev=Math.min(1,Math.max(0,(t-1.4)/2.2));
    const beat=1+Math.sin(t*2.4)*0.028*rev+Math.sin(t*4.8)*0.011*rev;
    heartPoints.scale.setScalar(beat);
    heartPoints.position.y=-9.2*(beat-1)+Math.sin(t*0.9)*0.2;
    heartPoints.rotation.y=Math.sin(t*0.26)*0.19;
    beamPoints.material.uniforms.uScale.value=0.44*(1+Math.sin(t*2.4)*0.3);

    if(moonSprite) moonSprite.material.opacity=Math.min(1,Math.max(0,(t-0.5)/2.2))*0.9;

    lanterns.forEach(function(s){
      const u=s.userData;
      const climb=((t*u.speed*0.5+u.phase)%6.283)/6.283;
      s.material.opacity=Math.min(1,Math.max(0,(t-2.0)/1.6))*0.85*Math.sin(climb*Math.PI);
      s.position.y=u.base+climb*11+Math.sin(t*1.1+u.phase)*0.5;
      s.position.x=u.x+Math.sin(t*0.35+u.drift)*1.1;
    });

    let hitObj=null;
    if(hearts.length){
      raycaster.setFromCamera(pointer,camera);
      const h=raycaster.intersectObjects(hearts,false);
      hitObj=h.length?h[0].object:null;
    }
    hovered=hitObj;
    renderer.domElement.style.cursor=hitObj?'pointer':'grab';

    hearts.forEach(function(s,i){
      const u=s.userData;
      const o=Math.min(1,Math.max(0,(t-2.6-i*0.13)/1.1));
      u.pulse*=0.92;
      s.material.opacity=o*0.98;
      s.position.y=u.base+Math.sin(t*1.25+u.phase)*0.55;
      const boost=(s===hovered?1.22:1)+u.pulse*0.45;
      const sc=u.sc*boost*(1+Math.sin(t*2.0+u.phase)*0.05);
      s.scale.x+=(sc-s.scale.x)*0.14;
      s.scale.y+=(sc-s.scale.y)*0.14;
    });

    elevation+=(targetElevation-elevation)*0.045;
    dist+=(targetDist-dist)*0.045;
    camera.position.set(0,3.0+Math.sin(elevation)*dist*0.52+Math.sin(t*0.4)*0.3,Math.cos(elevation)*dist);
    camera.lookAt(0,5.4,0);
    renderer.render(scene,camera);
  }

  function start(){
    if(started) return; started=true;
    try{ init(); }
    catch(err){
      console.error('Galaxy init failed:',err);
      document.getElementById('galaxy-loading').textContent='Thiết bị không hỗ trợ WebGL 😢';
      return;
    }
    running=true; tick();
    setTimeout(function(){
      document.getElementById('galaxy-loading').classList.add('gone');
      sGalaxy.classList.add('is-ready');
    },700);
  }
  return { start:start };
})();

if(document.fonts && document.fonts.load) document.fonts.load('700 34px "Quicksand"').catch(function(){});
</script>
